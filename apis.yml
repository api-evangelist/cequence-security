apis:
- name: Cequence AI Gateway
  description: >-
    Enterprise AI Gateway that makes applications agent-ready through governed Model Context Protocol
    integration. Register a REST API from its OpenAPI spec (or proxy a third-party remote MCP server)
    and the gateway publishes it as an MCP endpoint with inbound SSO/OAuth/API-key/JWT authentication,
    outbound credential injection (OAuth 2.1 authorization or client-credentials, API key, bearer, JWT
    bearer, basic, passthrough), per-tool rate limiting, DLP redaction, circuit breaking, agent personas
    that compose tools across servers, a SKILL.md skill registry, and audit export to Splunk HEC,
    Datadog, OTLP or syslog. Cequence also operates a first-party hosted MCP server, provisioned for
    every tenant, that manages the gateway itself from any agent.
  humanURL: https://docs.aigateway.cequence.ai/docs/introduction
