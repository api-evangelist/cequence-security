aid: cequence-security
name: Cequence Security
description: >-
  Cequence Security (cequence.ai) is an application, API, and AI protection vendor whose Unified API
  Protection (UAP) platform discovers documented, undocumented, shadow and third-party APIs, builds a
  runtime API inventory, scores risk and compliance, tests APIs in CI/CD, and mitigates bot, fraud and
  business-logic abuse at runtime. Its newer Cequence AI Gateway makes existing enterprise applications
  agent-ready by turning REST APIs (from an uploaded OpenAPI spec) and third-party remote MCP servers
  into governed Model Context Protocol endpoints, with SSO/OAuth 2.1 inbound authentication, credential
  injection outbound, per-tool rate limiting, DLP redaction, agent personas, a skill registry and SIEM
  audit export. Cequence publishes a first-party hosted MCP server for managing the AI Gateway itself,
  an npm CLI (@cequenceai/mcp-cli), a Zendesk-hosted product knowledge base with dated release notes,
  and a trust center carrying SOC 2 Type 2, PCI DSS v4.0.1 and ISO 27001:2022 attestations.
